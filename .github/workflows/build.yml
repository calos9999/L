name: Build LineageOS 18.1 OnePlus 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          temp-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Setup Build Packages
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf \
          lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
          xxd zip zlib1g-dev python-is-python3 openjdk-11-jdk libtinfo5

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

          git config --global user.name "ActionsBuilder"
          git config --global user.email "actions@build.local"
          git lfs install

      - name: Sync LineageOS 18.1 Source
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1 --git-lfs --no-clone-bundle
          repo sync -c --no-clone-bundle --no-tags --current-branch -j$(nproc)

      - name: Pull OnePlus 3 Trees
        run: |
          cd ~/android/lineage
          git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_device_oneplus_oneplus3.git device/oneplus/oneplus3
          git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_kernel_oneplus_msm8996.git kernel/oneplus/msm8996
          git clone --depth=1 -b lineage-18.1 https://github.com/TheMuppets/proprietary_vendor_oneplus.git vendor/oneplus

      - name: Compile ROM
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          breakfast oneplus3
          brunch oneplus3

      - name: Upload ROM Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-18.1-oneplus3
          path: /home/runner/work/**/out/target/product/oneplus3/lineage-*.zip
          retention-days: 7
