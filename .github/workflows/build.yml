name: Build LineageOS OnePlus 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build packages
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf \
          lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
          xxd zip zlib1g-dev python-is-python3 openjdk-11-jdk libtinfo5

      - name: Install repo and configure git
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

          git config --global user.email "builder@action.local"
          git config --global user.name "Lineage Builder"
          git lfs install
          git config --global trailer.changeid.key "Change-Id"

      - name: Initialize and sync LineageOS source
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --git-lfs --no-clone-bundle
          repo sync -c -j$(nproc)

      - name: Prepare device-specific code (breakfast)
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          breakfast oneplus3

      - name: Extract proprietary blobs
        run: |
          cd ~/android/lineage
          # Alternativa all'estrazione via USB da telefono collegato:
          git clone -b lineage-18.1 https://github.com/TheMuppets/proprietary_vendor_oneplus.git vendor/oneplus

      - name: Start the build (brunch)
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 50G
          brunch oneplus3

      - name: Upload output zip and recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-oneplus3-artifacts
          path: |
            /home/runner/android/lineage/out/target/product/oneplus3/lineage-*.zip
            /home/runner/android/lineage/out/target/product/oneplus3/recovery.img
            
